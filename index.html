<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Minha Loja Online</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; }
    h1 { text-align: center; }
    .catalogo { display: flex; flex-wrap: wrap; justify-content: center; }
    .produto { border: 1px solid #ccc; background: #fff; padding: 15px; margin: 10px; width: 250px; text-align: center; }
    .produto img { width: 100%; height: auto; }
    .pix img { width: 200px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Bem-vindo à Minha Loja</h1>
  <div class="catalogo">
    <div class="produto">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6a/Wireless_earbuds.jpg" alt="Fones de ouvido sem fio">
      <h2>Fones de ouvido sem fio</h2>
      <p>Preço: R$ 199,90</p>
      <div class="pix">
        <p>Pague com Pix:</p>
        <img src="LINK_DO_SEU_QRCODE_PIX_FONES.png" alt="QR Code Pix Fones">
      </div>
    </div>

    <div class="produto">
      <img src="https://upload.wikimedia.org/wikipedia/commons/4/4e/Smartwatch.jpg" alt="Relógio Fitness">
      <h2>Relógio Fitness</h2>
      <p>Preço: R$ 149,90</p>
      <div class="pix">
        <p>Pague com Pix:</p>
        <img src="LINK_DO_SEU_QRCODE_PIX_RELOGIO.png" alt="QR Code Pix Relógio">
      </div>
    </div>

    <div class="produto">
      <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Electric_scooter.jpg" alt="Scooter Elétrica">
      <h2>Scooter Elétrica</h2>
      <p>Preço: R$ 3.499,00</p>
      <div class="pix">
        <p>Pague com Pix:</p>
        <img src="LINK_DO_SEU_QRCODE_PIX_SCOOTER.png" alt="QR Code Pix Scooter">
      </div>
    </div>
  </div>
</body>
</html>
